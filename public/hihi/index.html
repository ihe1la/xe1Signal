<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sakura Dream</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Creepster&family=Zen+Maru+Gothic:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg1: #1f0a17;
      --bg2: #3a1029;
      --bg3: #14060f;
      --card: rgba(42, 12, 32, 0.78);
      --ink: #fbcfe8;
      --mute: #f9a8d4;
      --accent: #f472b6;
      --orb1: #4a1236;
      --orb2: #9d174d;
      --orb3: #db2777;
      --orb4: #f472b6;
      --time: #fff0f7;
      --petal-a: #f9a8d4;
      --petal-b: #db2777;
      --border: rgba(244, 114, 182, 0.4);
      --glow: rgba(236, 72, 153, 0.4);
      --radius: 32px;
      --vignette: rgba(0, 0, 0, 0.35);
      --drip-op: 0;
      --shake-amt: 0px;
      --title-weight: 600;
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: "Zen Maru Gothic", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 80% 50% at 50% -5%, var(--bg2), transparent 55%),
        linear-gradient(165deg, var(--bg1) 0%, var(--bg2) 50%, var(--bg3) 100%);
    }
    .tag {
      position: fixed; top: 1rem; left: 1rem; z-index: 5;
      font-size: .7rem; letter-spacing: .18em; color: var(--ink);
      background: var(--card); padding: .35rem .75rem; border-radius: 999px;
      border: 1px solid var(--border);
      transition: color .8s, background .8s, border-color .8s;
    }
    .vignette {
      position: fixed; inset: 0; pointer-events: none; z-index: 3;
      background: radial-gradient(ellipse at center, transparent 38%, var(--vignette) 100%);
      transition: background 1s;
    }
    .drips {
      position: fixed; inset: 0; pointer-events: none; z-index: 1;
      opacity: var(--drip-op); transition: opacity 1.2s;
    }
    .drip {
      position: absolute; top: 0; left: var(--x); width: var(--w); height: 0;
      background: linear-gradient(180deg, #6b0000, #c41e1e);
      border-radius: 0 0 40% 40%;
      animation: drip var(--t) linear infinite; animation-delay: var(--d);
    }
    @keyframes drip {
      0% { height: 0; opacity: 0; }
      20% { opacity: .85; }
      100% { height: var(--h); opacity: .45; }
    }
    .petals { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
    .petal {
      position: absolute; top: -8%; width: 12px; height: 16px;
      border-radius: 80% 10% 80% 10%;
      background: linear-gradient(135deg, var(--petal-a), var(--petal-b));
      opacity: .55; animation: fall linear infinite;
      box-shadow: 0 0 10px var(--glow);
    }
    @keyframes fall {
      to { transform: translate3d(var(--d), 110vh, 0) rotate(420deg); opacity: 0; }
    }
    .card {
      position: relative; z-index: 4;
      width: min(92vw, 360px);
      padding: 2.4rem 1.6rem 2rem;
      background: var(--card);
      border-radius: var(--radius);
      text-align: center;
      border: 1px solid var(--border);
      box-shadow: 0 20px 50px var(--glow);
      backdrop-filter: blur(14px);
      transition: background .9s, border-color .9s, box-shadow .9s, border-radius .9s;
    }
    h1 {
      font-family: var(--title-font, "Cormorant Garamond"), serif;
      font-size: 1.55rem; font-weight: var(--title-weight);
      color: var(--ink); margin-bottom: .3rem;
      letter-spacing: var(--title-track, 0.02em);
      text-shadow: 0 0 18px var(--glow);
      transition: color .9s, text-shadow .9s, letter-spacing .9s;
    }
    .sub {
      font-size: .85rem; color: var(--mute); margin-bottom: 1.5rem;
      transition: color .9s; min-height: 1.2em;
    }
    .orb {
      width: 200px; height: 200px; margin: 0 auto 1.2rem;
      border-radius: 50%; display: grid; place-items: center;
      background: radial-gradient(circle at 35% 30%, var(--orb1) 0%, var(--orb2) 32%, var(--orb3) 62%, var(--orb4) 100%);
      box-shadow: 0 0 0 8px color-mix(in srgb, var(--orb3) 45%, transparent), 0 0 36px var(--glow);
      position: relative;
      transition: box-shadow .9s;
    }
    .orb::after {
      content: ""; position: absolute; inset: -10px; border-radius: 50%;
      border: 2px dashed color-mix(in srgb, var(--accent) 40%, transparent);
      animation: spin var(--spin, 40s) linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .time {
      font-family: "Cormorant Garamond", serif;
      font-size: 3.2rem; font-weight: 600; color: var(--time);
      letter-spacing: .04em; position: relative; z-index: 1;
      text-shadow: 0 1px 2px rgba(0,0,0,.15), 0 0 14px var(--glow);
      transform: translate(var(--shake-amt), 0);
      transition: color .8s, text-shadow .8s;
    }
    .status {
      color: var(--accent); margin-bottom: 1.2rem; font-size: .95rem;
      min-height: 1.4em; transition: color .8s;
    }
    button {
      font: inherit; cursor: pointer; border: none;
      border-radius: calc(var(--radius) * 0.8);
      padding: .65rem 1.3rem; margin: 0 .25rem;
      background: linear-gradient(135deg, var(--petal-a), var(--petal-b));
      color: #fff; letter-spacing: .04em;
      box-shadow: 0 6px 18px var(--glow);
      transition: border-radius .8s, box-shadow .8s;
    }
    button.ghost {
      background: transparent; color: var(--ink);
      border: 1px solid var(--border); box-shadow: none;
    }
    .pulse { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
    .flash { position: fixed; inset: 0; pointer-events: none; z-index: 7; background: #c00; opacity: 0; }
    .flash.on { animation: flashA .28s ease-out; }
    @keyframes flashA { 0% { opacity: .55; } 100% { opacity: 0; } }
    .eyes { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
    .eye {
      position: absolute; width: 54px; height: 18px; opacity: 0; transition: opacity .35s;
      background:
        radial-gradient(circle at 24% 50%, #ff2a2a 0 5px, transparent 6px),
        radial-gradient(circle at 76% 50%, #ff2a2a 0 5px, transparent 6px);
      filter: drop-shadow(0 0 8px #f00);
    }
    .eye.on { opacity: .95; }
    .eye.blink { opacity: 0; transition: opacity .06s; }
    .whisper {
      position: fixed; z-index: 6; pointer-events: none; opacity: 0;
      font-family: Creepster, cursive; letter-spacing: .1em; color: #ff3b3b;
      text-shadow: 0 0 14px #900, 2px 2px 0 #000; font-size: clamp(1.4rem, 5vw, 2.4rem);
    }
    .whisper.on { animation: whisperIn 3s ease-out forwards; }
    @keyframes whisperIn {
      0% { opacity: 0; transform: scale(.85); filter: blur(6px); }
      15% { opacity: 1; transform: scale(1); filter: blur(0); }
      75% { opacity: .85; }
      100% { opacity: 0; transform: scale(1.12); filter: blur(3px); }
    }
    body.glitch .time {
      text-shadow: 4px 0 #ff0033, -4px 0 #00e5ff, 0 0 18px var(--glow);
    }
    body.glitch .card { filter: contrast(1.25) saturate(1.5); }
    body.panic .time { animation: panicPulse .5s ease-in-out infinite; }
    @keyframes panicPulse { 50% { transform: scale(1.14); } }
    body.strobe { animation: strobe .18s steps(2) infinite; }
    @keyframes strobe { 50% { filter: invert(.08) hue-rotate(-12deg) contrast(1.2); } }
    body.ending .petal { transition: opacity 2.5s ease; opacity: 0.12; }
    body.ending .drip { transition: opacity 2s ease; opacity: 0 !important; }
    body.rest .card { transition: opacity 1.2s ease, transform 1.2s ease; }
    body.rest .time { opacity: .9; transition: opacity 1.5s ease; }
    .dm {
      position: fixed; right: 4vw; bottom: 6vh; z-index: 8; pointer-events: none;
      width: min(80vw, 300px);
      font-family: "Zen Maru Gothic", sans-serif;
      opacity: 0; transform: translateY(40px) scale(.96);
      transition: opacity .45s ease, transform .55s cubic-bezier(.2, 1.4, .4, 1);
    }
    .dm.on { opacity: 1; transform: translateY(0) scale(1); }
    .dm-head {
      display: flex; align-items: center; gap: .45rem;
      font-size: .72rem; color: #fbcfe8; margin: 0 0 .35rem .3rem;
    }
    .dm-head .avatar {
      width: 22px; height: 22px; border-radius: 50%;
      display: grid; place-items: center; font-size: .7rem; color: #fff;
      background: #f472b6;
    }
    .dm-head small { color: #c084fc; margin-left: auto; margin-right: .3rem; }
    .bubble {
      position: relative; display: inline-block; max-width: 100%;
      padding: .7rem .95rem; border-radius: 18px 18px 18px 4px;
      background: #fff; color: #831843; font-size: .92rem; line-height: 1.4;
      border: 1px solid #fbcfe8;
    }
    .typing { display: inline-flex; gap: 4px; padding: .2rem 0; }
    .typing i {
      width: 7px; height: 7px; border-radius: 50%; background: #f9a8d4;
      animation: dot 1s infinite ease-in-out;
    }
    .typing i:nth-child(2) { animation-delay: .15s; }
    .typing i:nth-child(3) { animation-delay: .3s; }
    @keyframes dot { 0%, 100% { transform: translateY(0); opacity: .5; } 50% { transform: translateY(-4px); opacity: 1; } }
    .msg .caret { display: inline-block; width: 1px; height: 1em; background: #db2777; vertical-align: -2px; margin-left: 1px; animation: caret .8s steps(1) infinite; }
    @keyframes caret { 50% { opacity: 0; } }
    .dm-seen { font-size: .62rem; color: #c084fc; margin: .3rem 0 0 .4rem; opacity: 0; transition: opacity .4s; }
    .dm-seen.on { opacity: 1; }
    body.ironic .petal { opacity: .75; }
  </style>
</head>
<body>
  <div class="tag" id="tag">SAKURA DREAM</div>
  <div class="vignette"></div>
  <div class="pulse" id="pulse"></div>
  <div class="eyes" id="eyes">
    <span class="eye" style="left:6%;top:20%"></span>
    <span class="eye" style="right:8%;top:34%"></span>
    <span class="eye" style="left:14%;bottom:18%"></span>
    <span class="eye" style="right:16%;bottom:12%"></span>
    <span class="eye" style="left:46%;top:6%"></span>
  </div>
  <div class="whisper" id="whisper"></div>
  <div class="flash" id="flash"></div>
  <div class="dm" id="sticker">
    <div class="dm-head"><span class="avatar">桜</span><b>sakura</b><small>now</small></div>
    <div class="bubble"><span class="typing" id="dmTyping"><i></i><i></i><i></i></span><span class="msg" id="dmMsg"></span></div>
    <div class="dm-seen" id="dmSeen">Delivered</div>
  </div>
  <div class="drips" id="drips"></div>
  <div class="petals" id="petals"></div>
  <main class="card">
    <h1 id="title">Sakura Dream</h1>
    <p class="sub" id="sub">soft petals · quiet heart</p>
    <div class="orb"><div class="time" id="time">01:00</div></div>
    <p class="status" id="status">Drifting gently…</p>
    <button type="button" id="toggle">Pause</button>
    <button type="button" class="ghost" id="reset">Reset</button>
  </main>

  <script src="/hihi/horror-audio.js"></script>
  <script src="/hihi/timer-core.js"></script>
  <script>
    const statusEl = document.getElementById("status");
    const easeInOut = (t) => t * t * (3 - 2 * t);
    const clamp01 = (t) => Math.max(0, Math.min(1, t));

    function hexToRgb(h) {
      const n = h.replace("#", "");
      return [parseInt(n.slice(0, 2), 16), parseInt(n.slice(2, 4), 16), parseInt(n.slice(4, 6), 16)];
    }
    function rgbToHex(r, g, b) {
      return "#" + [r, g, b].map((x) => Math.round(x).toString(16).padStart(2, "0")).join("");
    }
    function mixHex(a, b, t) {
      t = clamp01(t);
      const A = hexToRgb(a), B = hexToRgb(b);
      return rgbToHex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t);
    }
    function mixRgba(a, b, t) {
      // a/b: [r,g,b,alpha]
      t = clamp01(t);
      const r = Math.round(a[0] + (b[0] - a[0]) * t);
      const g = Math.round(a[1] + (b[1] - a[1]) * t);
      const bl = Math.round(a[2] + (b[2] - a[2]) * t);
      const al = a[3] + (b[3] - a[3]) * t;
      return `rgba(${r},${g},${bl},${al.toFixed(3)})`;
    }

    /* Sweet ambient — fades with setSweetness */
    const Sweet = (() => {
      let ctx, master, pad = [], chimeTimer = null, started = false, sweetness = 1;
      function ensure() {
        if (ctx) return ctx;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = 0.62;
        master.connect(ctx.destination);
        return ctx;
      }
      function start() {
        const c = ensure();
        if (!c) return;
        if (c.state === "suspended") c.resume();
        if (started) {
          setSweetness(sweetness);
          return;
        }
        started = true;
        master.gain.value = 0.62 * sweetness;
        [261.63, 329.63, 392.0].forEach((f, i) => {
          const o = c.createOscillator();
          const g = c.createGain();
          o.type = i ? "sine" : "triangle";
          o.frequency.value = f / 2;
          g.gain.value = 0.08;
          o.connect(g); g.connect(master);
          o.start();
          pad.push({ o, g });
        });
        const bell = () => {
          if (!started || sweetness < 0.04) return;
          const freqs = [523.25, 587.33, 659.25, 783.99];
          const f = freqs[Math.floor(Math.random() * freqs.length)];
          const o = c.createOscillator();
          const g = c.createGain();
          o.type = "sine";
          o.frequency.value = f;
          const now = c.currentTime;
          g.gain.setValueAtTime(0.0001, now);
          g.gain.exponentialRampToValueAtTime(0.16 * sweetness, now + 0.03);
          g.gain.exponentialRampToValueAtTime(0.0001, now + 1.8);
          o.connect(g); g.connect(master);
          o.start(); o.stop(now + 1.9);
        };
        bell();
        chimeTimer = setInterval(bell, 2200);
      }
      function setSweetness(s) {
        sweetness = clamp01(s);
        if (!ctx || !master) return;
        master.gain.setTargetAtTime(0.62 * sweetness, ctx.currentTime, 0.45);
        pad.forEach(({ g }, i) => {
          g.gain.setTargetAtTime(0.08 * sweetness * (1 - i * 0.08), ctx.currentTime, 0.45);
        });
        if (sweetness < 0.05 && chimeTimer) {
          clearInterval(chimeTimer);
          chimeTimer = null;
        } else if (sweetness >= 0.05 && started && !chimeTimer) {
          chimeTimer = setInterval(() => {
            if (sweetness < 0.04) return;
            const freqs = [523.25, 587.33, 659.25, 783.99];
            const f = freqs[Math.floor(Math.random() * freqs.length)];
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.type = "sine";
            o.frequency.value = f;
            const now = ctx.currentTime;
            g.gain.setValueAtTime(0.0001, now);
            g.gain.exponentialRampToValueAtTime(0.16 * sweetness, now + 0.03);
            g.gain.exponentialRampToValueAtTime(0.0001, now + 1.8);
            o.connect(g); g.connect(master);
            o.start(); o.stop(now + 1.9);
          }, 2200);
        }
      }
      function stop() {
        if (chimeTimer) clearInterval(chimeTimer);
        chimeTimer = null;
        sweetness = 0;
        pad.forEach(({ o }) => { try { o.stop(); } catch (_) {} });
        pad = [];
        if (master && ctx) master.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.2);
        started = false;
      }
      return { start, setSweetness, stop, ensure };
    })();

    // petals + drips
    const petalsEl = document.getElementById("petals");
    for (let i = 0; i < 22; i++) {
      const e = document.createElement("span");
      e.className = "petal";
      e.style.left = Math.random() * 100 + "%";
      e.style.animationDuration = 8 + Math.random() * 12 + "s";
      e.style.animationDelay = -Math.random() * 14 + "s";
      e.style.setProperty("--d", Math.random() * 120 - 60 + "px");
      petalsEl.appendChild(e);
    }
    const drips = document.getElementById("drips");
    for (let i = 0; i < 14; i++) {
      const d = document.createElement("span");
      d.className = "drip";
      d.style.setProperty("--x", Math.random() * 100 + "%");
      d.style.setProperty("--w", 3 + Math.random() * 8 + "px");
      d.style.setProperty("--h", 16 + Math.random() * 52 + "vh");
      d.style.setProperty("--t", 9 + Math.random() * 14 + "s");
      d.style.setProperty("--d", -Math.random() * 12 + "s");
      drips.appendChild(d);
    }

    let horrorStarted = false;

    function unlockAudio() {
      Sweet.start();
      HorrorAudio.resume();
      if (!horrorStarted) HorrorAudio.setMix(0);
    }

    // any click/key/touch resumes audio (browsers block autoplay)
    ["pointerdown", "keydown", "touchstart"].forEach((ev) => {
      window.addEventListener(ev, unlockAudio, { passive: true });
    });
    try { unlockAudio(); } catch (_) {}

    // Text pacing: a line stays up long enough to read before the next replaces it.
    const sayState = new Map();
    const readMs = (text) => Math.max(2600, text.length * 75);
    function setNow(el, text) {
      el.textContent = text;
      sayState.set(el, { shown: text, at: performance.now() });
    }
    function say(el, text) {
      let s = sayState.get(el);
      if (!s) {
        setNow(el, text);
        return;
      }
      if (text === s.shown) return;
      if (performance.now() - s.at >= readMs(s.shown)) setNow(el, text);
    }

    function paintTheme(progress, opts) {
      const visualsOnly = opts && opts.visualsOnly;
      // smooth curve — stays cute longer, then eases into horror
      const raw = clamp01(progress);
      const t = easeInOut(Math.pow(raw, 1.35)); // slower early corruption

      const root = document.documentElement;

      root.style.setProperty("--bg1", mixHex("#1f0a17", "#140206", t));
      root.style.setProperty("--bg2", mixHex("#3a1029", "#2a060c", t));
      root.style.setProperty("--bg3", mixHex("#14060f", "#0c0204", t));
      root.style.setProperty("--ink", mixHex("#fbcfe8", "#ffe4e4", t));
      root.style.setProperty("--mute", mixHex("#f9a8d4", "#f87171", t));
      root.style.setProperty("--accent", mixHex("#f472b6", "#ef4444", t));
      root.style.setProperty("--orb1", mixHex("#4a1236", "#3f0a12", t));
      root.style.setProperty("--orb2", mixHex("#9d174d", "#7f1d1d", t));
      root.style.setProperty("--orb3", mixHex("#db2777", "#b91c1c", t));
      root.style.setProperty("--orb4", mixHex("#f472b6", "#dc2626", t));
      root.style.setProperty("--time", mixHex("#fff0f7", "#fff5f5", t));
      root.style.setProperty("--petal-a", mixHex("#f9a8d4", "#7f1d1d", t));
      root.style.setProperty("--petal-b", mixHex("#db2777", "#ef4444", t));
      root.style.setProperty("--border", mixRgba([244,114,182,0.4], [220,38,38,0.55], t));
      root.style.setProperty("--glow", mixRgba([236,72,153,0.4], [220,38,38,0.45], t));
      root.style.setProperty("--card", mixRgba([42,12,32,0.78], [28,4,8,0.84], t));
      root.style.setProperty("--vignette", mixRgba([0,0,0,0.35], [50,0,0,0.78], t));
      root.style.setProperty("--drip-op", String(clamp01((t - 0.45) / 0.4)));
      root.style.setProperty("--radius", 32 - t * 20 + "px");
      root.style.setProperty("--spin", 40 - t * 34 + "s");

      // late shake
      const shakeT = clamp01((t - 0.82) / 0.18);
      root.style.setProperty("--shake-amt", shakeT > 0 ? (Math.sin(performance.now() / 40) * 2.5 * shakeT) + "px" : "0px");

      // title font swap near the end only
      if (t > 0.62) {
        title.style.fontFamily = "Creepster, cursive";
        title.style.letterSpacing = "0.08em";
      } else {
        title.style.fontFamily = '"Cormorant Garamond", serif';
        title.style.letterSpacing = "0.02em";
      }

      if (visualsOnly) return;

      if (raw < 0.22) {
        say(title, "Sakura Dream");
        say(sub, "soft petals · quiet heart");
        say(tag, "SAKURA DREAM");
      } else if (raw < 0.42) {
        say(title, "Sakura Dream");
        say(sub, "the breeze feels colder…");
        say(tag, "SAKURA DREAM");
      } else if (raw < 0.62) {
        say(title, "Wilted Sakura");
        say(sub, "pink fading to rust");
        say(tag, "WILTING");
      } else if (raw < 0.82) {
        say(title, "Blood Sakura");
        say(sub, "something bloomed wrong");
        say(tag, "BLOOD BLOOM");
      } else {
        say(title, "Blood Bloom");
        say(sub, "it was never a dream");
        say(tag, "CORRUPTED");
      }

      // soft stays louder longer; horror stays quieter overall
      const sweetLevel = clamp01(1 - easeInOut(raw / 0.92));
      const horrorLevel = clamp01(easeInOut((raw - 0.28) / 0.65));

      Sweet.setSweetness(sweetLevel);
      if (!horrorStarted && horrorLevel > 0.02) {
        horrorStarted = true;
        HorrorAudio.resume();
        HorrorAudio.resetPhases();
      }
      HorrorAudio.setMix(horrorLevel * 0.28);
      if (horrorStarted) {
        HorrorAudio.update(easeInOut(clamp01((raw - 0.2) / 0.8)), true);
      }
    }

    /* ---------- fear / stress layer ---------- */
    const pulseEl = document.getElementById("pulse");
    const flashEl = document.getElementById("flash");
    const whisperEl = document.getElementById("whisper");
    const eyeEls = [...document.querySelectorAll("#eyes .eye")];

    let beepCtx = null;
    function beep(freq, dur, gain) {
      try {
        if (!beepCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          beepCtx = new AC();
        }
        if (beepCtx.state === "suspended") beepCtx.resume();
        const o = beepCtx.createOscillator();
        const g = beepCtx.createGain();
        o.type = "square";
        o.frequency.value = freq;
        const now = beepCtx.currentTime;
        g.gain.setValueAtTime(0.0001, now);
        g.gain.exponentialRampToValueAtTime(gain, now + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
        o.connect(g); g.connect(beepCtx.destination);
        o.start(); o.stop(now + dur + 0.02);
      } catch (_) {}
    }

    function flash() {
      flashEl.classList.remove("on");
      void flashEl.offsetWidth;
      flashEl.classList.add("on");
    }
    function whisper(text) {
      whisperEl.textContent = text;
      whisperEl.style.left = 8 + Math.random() * 50 + "%";
      whisperEl.style.top = 12 + Math.random() * 62 + "%";
      whisperEl.style.transform = `rotate(${Math.random() * 14 - 7}deg)`;
      whisperEl.classList.remove("on");
      void whisperEl.offsetWidth;
      whisperEl.classList.add("on");
    }
    function showEyes(n) {
      eyeEls.forEach((e, i) => e.classList.toggle("on", i < n));
    }
    function glitchBurst(ms) {
      document.body.classList.add("glitch");
      setTimeout(() => document.body.classList.remove("glitch"), ms || 140);
    }

    const EVENTS = [
      { at: 0.28, fn: () => { whisper("did you hear that?"); beep(180, 0.2, 0.03); } },
      { at: 0.38, fn: () => { showEyes(1); } },
      { at: 0.46, fn: () => { glitchBurst(160); whisper("it's watching"); } },
      { at: 0.54, fn: () => { showEyes(2); flash(); beep(120, 0.25, 0.05); } },
      { at: 0.62, fn: () => { whisper("behind you"); glitchBurst(200); } },
      { at: 0.70, fn: () => { showEyes(3); flash(); HorrorAudio.stinger(); } },
      { at: 0.77, fn: () => { whisper("don't blink"); glitchBurst(240); } },
      { at: 0.83, fn: () => { showEyes(5); flash(); document.body.classList.add("panic"); } },
      { at: 0.89, fn: () => { whisper("RUN"); flash(); glitchBurst(300); } },
      { at: 0.94, fn: () => { document.body.classList.add("strobe"); flash(); } },
    ];
    let eventDone = EVENTS.map(() => false);
    let lastSecShown = -1;
    let nextBlink = 0;

    function clearFx() {
      eventDone = EVENTS.map(() => false);
      lastSecShown = -1;
      showEyes(0);
      document.body.classList.remove("glitch", "panic", "strobe");
      whisperEl.classList.remove("on");
      flashEl.classList.remove("on");
      pulseEl.style.boxShadow = "none";
    }

    function stressFx(progress, remainingMs, running) {
      if (!running) return;
      EVENTS.forEach((ev, i) => {
        if (!eventDone[i] && progress >= ev.at) {
          eventDone[i] = true;
          ev.fn();
        }
      });

      // heartbeat vignette — speeds up and darkens with fear
      const fear = clamp01((progress - 0.25) / 0.75);
      if (fear > 0) {
        const bpm = 58 + 130 * Math.pow(fear, 1.4);
        const ph = ((performance.now() / 1000) * (bpm / 60)) % 1;
        const env = ph < 0.12 ? Math.sin((ph / 0.12) * Math.PI)
                  : ph > 0.22 && ph < 0.34 ? 0.55 * Math.sin(((ph - 0.22) / 0.12) * Math.PI) : 0;
        const spread = 60 + env * 150 * (0.4 + fear);
        const alpha = (0.12 + env * 0.55) * fear;
        pulseEl.style.boxShadow = `inset 0 0 ${spread}px ${spread * 0.35}px rgba(160,0,0,${alpha.toFixed(3)})`;
      }

      // random micro-glitches and eye blinks as fear rises
      if (fear > 0.35 && Math.random() < 0.012 + fear * 0.03) glitchBurst(90 + Math.random() * 90);
      const now = performance.now();
      if (now > nextBlink && fear > 0.3) {
        nextBlink = now + 1200 + Math.random() * 1800;
        const e = eyeEls[Math.floor(Math.random() * eyeEls.length)];
        if (e.classList.contains("on")) {
          e.classList.add("blink");
          setTimeout(() => e.classList.remove("blink"), 120);
        }
      }

      // final countdown: rising stress beeps once per second
      const sec = Math.ceil(remainingMs / 1000);
      if (sec <= 10 && sec >= 1 && sec !== lastSecShown) {
        lastSecShown = sec;
        beep(520 + (10 - sec) * 90, 0.09 + (10 - sec) * 0.012, 0.05 + (10 - sec) * 0.009);
        if (sec <= 5) flash();
      }
    }

    const END_MS = 26000;
    let ironic = false;
    const stickerEl = document.getElementById("sticker");

    const DM_TEXT = "awww, ur actually scared of a timer? this is so cute, i might cry 💋";
    const dmTyping = document.getElementById("dmTyping");
    const dmMsg = document.getElementById("dmMsg");
    const dmSeen = document.getElementById("dmSeen");
    let dmShown = false;
    let dmTimers = [];

    function dmPing() {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        const c = new AC();
        const g = c.createGain();
        g.connect(c.destination);
        const now = c.currentTime;
        [1318.5, 1760].forEach((f, i) => {
          const o = c.createOscillator();
          o.type = "sine";
          o.frequency.value = f;
          const t = now + i * 0.09;
          const og = c.createGain();
          og.gain.setValueAtTime(0.0001, t);
          og.gain.exponentialRampToValueAtTime(0.18, t + 0.01);
          og.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
          o.connect(og); og.connect(g);
          o.start(t); o.stop(t + 0.4);
        });
        setTimeout(() => { try { c.close(); } catch (_) {} }, 900);
      } catch (_) {}
    }

    function showDM() {
      if (dmShown) return;
      dmShown = true;
      dmMsg.textContent = "";
      dmTyping.style.display = "inline-flex";
      dmSeen.classList.remove("on");
      stickerEl.classList.add("on");
      dmPing();
      dmTimers.push(setTimeout(() => {
        dmTyping.style.display = "none";
        const chars = [...DM_TEXT];
        let i = 0;
        const caret = document.createElement("span");
        caret.className = "caret";
        const textNode = document.createTextNode("");
        dmMsg.append(textNode, caret);
        const iv = setInterval(() => {
          textNode.data += chars[i++];
          if (i >= chars.length) {
            clearInterval(iv);
            dmTimers.push(setTimeout(() => {
              caret.remove();
              dmSeen.classList.add("on");
            }, 500));
          }
        }, 38);
        dmTimers.push(iv);
      }, 1000));
    }

    function hideDM() {
      dmTimers.forEach((t) => { clearTimeout(t); clearInterval(t); });
      dmTimers = [];
      dmShown = false;
      stickerEl.classList.remove("on");
      dmMsg.textContent = "";
      dmTyping.style.display = "inline-flex";
      dmSeen.classList.remove("on");
    }

    // cartoon "ta-da" + boing for the ironic comeback
    function jokeJingle() {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        const c = new AC();
        const out = c.createGain();
        out.gain.value = 0.2;
        out.connect(c.destination);
        const now = c.currentTime;
        // sparkly major arpeggio
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
          const o = c.createOscillator();
          const g = c.createGain();
          o.type = "triangle";
          o.frequency.value = f;
          const t = now + i * 0.11;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.5, t + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.7);
          o.connect(g); g.connect(out);
          o.start(t); o.stop(t + 0.75);
        });
        // cartoon boing
        const b = c.createOscillator();
        const bg = c.createGain();
        b.type = "sine";
        const bt = now + 0.55;
        b.frequency.setValueAtTime(220, bt);
        b.frequency.exponentialRampToValueAtTime(700, bt + 0.12);
        b.frequency.exponentialRampToValueAtTime(160, bt + 0.4);
        bg.gain.setValueAtTime(0.0001, bt);
        bg.gain.exponentialRampToValueAtTime(0.6, bt + 0.02);
        bg.gain.exponentialRampToValueAtTime(0.0001, bt + 0.45);
        b.connect(bg); bg.connect(out);
        b.start(bt); b.stop(bt + 0.5);
        setTimeout(() => { try { c.close(); } catch (_) {} }, 2000);
      } catch (_) {}
    }

    let ending = false;
    let didShutdown = false;
    let endRaf = 0;

    function softResolveChime() {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        const c = new AC();
        const g = c.createGain();
        g.gain.value = 0.0001;
        g.connect(c.destination);
        // gentle resolving triad, quiet
        [392.0, 493.88, 587.33].forEach((f, i) => {
          const o = c.createOscillator();
          o.type = "sine";
          o.frequency.value = f;
          o.connect(g);
          o.start(c.currentTime + i * 0.12);
          o.stop(c.currentTime + 2.4);
        });
        const now = c.currentTime;
        g.gain.exponentialRampToValueAtTime(0.12, now + 0.15);
        g.gain.exponentialRampToValueAtTime(0.0001, now + 2.6);
        setTimeout(() => { try { c.close(); } catch (_) {} }, 3200);
      } catch (_) {}
    }

    function beginEnding() {
      if (ending || didShutdown) return;
      ending = true;
      clearFx();
      document.body.classList.add("ending");
      time.textContent = "00:00";
      document.title = "00:00 — Sakura";
      toggle.disabled = true;
      toggle.textContent = "…";
      setNow(statusEl, "the bloom exhales…");
      setNow(title, "Blood Sakura");
      setNow(sub, "even nightmares fade");
      setNow(tag, "FADING");

      const t0 = performance.now();

      function step(now) {
        const u = clamp01((now - t0) / END_MS);

        // act 1 (0–0.14): blood exhales. act 2: ironic slide back to soft dark pink
        let visualT;
        if (u < 0.14) visualT = 1 - easeInOut(u / 0.14) * 0.3;
        else visualT = 0.7 * (1 - easeInOut(clamp01((u - 0.14) / 0.26)));
        paintTheme(visualT, { visualsOnly: true });

        if (u >= 0.14 && !ironic) {
          ironic = true;
          document.body.classList.remove("ending");
          document.body.classList.add("ironic");
          jokeJingle();
        }

        if (u >= 0.14) {
          title.style.fontFamily = '"Cormorant Garamond", serif';
          title.style.letterSpacing = "0.02em";
          if (u < 0.3) {
            say(title, "Sakura Dream");
            say(sub, "oh hi. we're cute again. new me.");
            say(statusEl, "...yeah, we're not talking about that.");
            say(tag, "SAKURA DREAM");
          } else if (u < 0.46) {
            say(title, "Sakura Dream (TM)");
            say(sub, "those eyes? cats. obviously.");
            say(statusEl, "you screamed at a petal. a PETAL.");
            say(tag, "NOTHING HAPPENED");
          } else if (u < 0.64) {
            say(title, "Sakura Dream");
            say(sub, "your heart rate called. it wants an apology.");
            say(statusEl, "a whole minute and you looked like that. wow.");
            say(tag, "SASS MODE");
          } else {
            say(title, "Sakura Dream");
            say(sub, "petals sponsored by Big Pink");
            say(statusEl, "no refunds on adrenaline, bestie");
            say(tag, "UWU");
          }
          if (u >= 0.38) showDM();
        }

        // audio: horror out, sweet theme returns, then gently fades
        const horrorOut = clamp01(1 - easeInOut(Math.min(1, u / 0.13)));
        HorrorAudio.setMix(0.28 * horrorOut);
        if (u < 0.14) {
          Sweet.setSweetness(0);
        } else {
          Sweet.start();
          const swell = easeInOut(clamp01((u - 0.14) / 0.12));
          const tail = 1 - easeInOut(clamp01((u - 0.86) / 0.14));
          Sweet.setSweetness(swell * tail);
        }

        time.textContent = "00:00";

        if (u < 1) {
          endRaf = requestAnimationFrame(step);
          return;
        }

        // final rest — cheerful, counter asleep
        Sweet.stop();
        HorrorAudio.stopAll();
        horrorStarted = false;
        softResolveChime();
        didShutdown = true;
        ending = false;
        document.body.classList.add("rest");
        setNow(statusEl, "you survived. gently. you're welcome.");
        toggle.textContent = "—";
        document.title = "00:00 — survived";
        petalsEl.querySelectorAll(".petal").forEach((p) => {
          p.style.animationPlayState = "paused";
        });
      }

      // stop feeding horror update loop; just fade mix
      horrorStarted = false;
      endRaf = requestAnimationFrame(step);
    }

    reset.addEventListener("click", () => {
      if (endRaf) cancelAnimationFrame(endRaf);
      endRaf = 0;
      ending = false;
      ironic = false;
      didShutdown = false;
      clearFx();
      hideDM();
      document.body.classList.remove("ending", "rest", "ironic");
      unlockAudio();
      HorrorAudio.resetPhases();
      HorrorAudio.setMix(0);
      horrorStarted = false;
      Sweet.start();
      Sweet.setSweetness(1);
      toggle.disabled = false;
      petalsEl.querySelectorAll(".petal").forEach((p) => {
        p.style.animationPlayState = "running";
        p.style.opacity = "";
      });
      sayState.clear();
      paintTheme(0);
      setNow(statusEl, "Drifting gently…");
    });

    toggle.addEventListener("click", unlockAudio);

    bootTimer({
      totalMs: 60 * 1000,
      lockOnEnd: true,
      onTick({ remaining, total, running, ended, locked }) {
        if (didShutdown || ending) return;

        if (ended || locked) {
          paintTheme(1);
          beginEnding();
          return;
        }

        time.textContent = fmt(remaining);
        document.title = fmt(remaining) + " — Sakura";
        const progress = 1 - remaining / total;
        paintTheme(progress);
        stressFx(progress, remaining, running);

        if (!running) {
          const pausedText = progress > 0.5 ? "paused in the dark" : "Paused in the breeze";
          if (statusEl.textContent !== pausedText) setNow(statusEl, pausedText);
        } else if (progress < 0.25) {
          say(statusEl, "Drifting gently…");
        } else if (progress < 0.45) {
          say(statusEl, "a petal tastes like copper…");
        } else if (progress < 0.65) {
          say(statusEl, "don't trust the pink anymore");
        } else if (progress < 0.85) {
          say(statusEl, "the garden is bleeding");
        } else {
          say(statusEl, "IT BLOOMS IN YOUR THROAT");
        }

        toggle.textContent = running ? "Pause" : "Resume";
      }
    });
  </script>
</body>
</html>
